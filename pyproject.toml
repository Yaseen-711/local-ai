[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-core"
version = "0.1.0"
description = "Local AI Foundation Core Infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "pypdf>=5.0.0",
    "docker>=7.0.0",
    "docling>=2.120.0",
    "semantic-router>=0.1.16",
    "pydantic-ai-slim~=2.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests as live integration tests requiring running runtime",
]
