# Foundation Settings Configuration

[foundation]
environment = "development"
models_dir = "models"
configs_dir = "configs/models"

[providers.llama_cpp]
base_url = "http://127.0.0.1:8080"
timeout_seconds = 60
default_alias = "qwen3.5-9b"

[database]
url = "postgresql+psycopg://postgres:postgres@localhost:5432/local_ai"
pool_size = 5
max_overflow = 10
echo = false

[document]
default_parser = "docling"
enable_ocr = true
ocr_engine = "rapidocr"
enable_tables = true
enable_figures = true
enable_formulae = true

[artifact]
output_dir = "artifacts"
enable_xlsx = true
enable_docx = true
enable_pdf = true

[workspace]
default_executor = "docker"
docker_image = "python:3.12-slim"
cpu_limit = 2.0
mem_limit = "2g"
network_mode = "none"
default_timeout_seconds = 60.0
base_workspaces_dir = ".workspaces"
